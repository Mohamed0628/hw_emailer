name: Internship digest

on:
  schedule:
    # Run every 30 minutes. GitHub cron can be delayed under load.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without sending or saving state"
        type: boolean
        default: false

permissions:
  contents: write

# Prevent scheduled and manual digest runs from overlapping each other.
concurrency:
  group: daily-internship-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run
          else
            python -m src.main
          fi

      - name: Commit updated state safely
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Preserve the state generated by this run before refreshing main.
          cp data/seen_jobs.json /tmp/generated_seen_jobs.json

          # A PR or another state update may reach main while the scraper runs.
          # Refresh, merge both state dictionaries, and retry a raced push.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            python scripts/merge_seen_state.py \
              data/seen_jobs.json \
              /tmp/generated_seen_jobs.json \
              data/seen_jobs.json

            if git diff --quiet -- data/seen_jobs.json; then
              echo "No state changes to commit."
              exit 0
            fi

            git add data/seen_jobs.json
            git commit -m "chore: update seen jobs state [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update, retrying ($attempt/3)."
            sleep $((attempt * 2))
          done

          echo "Unable to update seen state after three attempts."
          exit 1