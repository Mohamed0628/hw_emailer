name: Tests

on:
  pull_request:
  push:
    branches:
      - feature/minnesota-medtech-fulltime

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: Run tests
        shell: bash
        run: |
          set +e
          pytest -q --tb=short 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "$status" > pytest-status.txt
          exit "$status"

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: |
            pytest-output.txt
            pytest-status.txt
          retention-days: 1
