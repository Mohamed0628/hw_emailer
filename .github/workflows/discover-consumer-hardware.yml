name: Validate consumer hardware boards

on:
  pull_request:
    paths:
      - config/companies_consumer_hardware_more.yaml
      - scripts/validate_consumer_hardware_catalog.py
      - .github/workflows/discover-consumer-hardware.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyyaml --quiet
      - name: Validate final public ATS catalog
        run: python scripts/validate_consumer_hardware_catalog.py
