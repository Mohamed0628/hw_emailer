name: Validate new RF robotics avionics boards

on:
  pull_request:
    paths:
      - "config/companies_rf_robotics_avionics.yaml"
      - "scripts/validate_rf_robotics_avionics_boards.py"
      - ".github/workflows/validate-rf-robotics-avionics.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate final public ATS boards
        shell: bash
        run: |
          set +e
          python scripts/validate_rf_robotics_avionics_boards.py | tee ats-validation-report.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload ATS validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-validation-report
          path: ats-validation-report.txt
          if-no-files-found: error
