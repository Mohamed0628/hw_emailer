name: Discover robotics and consumer hardware boards

on:
  pull_request:
    paths:
      - "scripts/discover_robotics_consumer_hardware_boards.py"
      - "scripts/discover_robotics_consumer_hardware_boards_2.py"
      - "scripts/discover_robotics_consumer_hardware_boards_3.py"
      - ".github/workflows/discover-robotics-consumer-hardware.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover public ATS boards
        shell: bash
        run: |
          python scripts/discover_robotics_consumer_hardware_boards.py > robotics-consumer-hardware-discovery.txt
          python scripts/discover_robotics_consumer_hardware_boards_2.py >> robotics-consumer-hardware-discovery.txt
          python scripts/discover_robotics_consumer_hardware_boards_3.py >> robotics-consumer-hardware-discovery.txt
          cat robotics-consumer-hardware-discovery.txt

      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: robotics-consumer-hardware-discovery
          path: robotics-consumer-hardware-discovery.txt
          if-no-files-found: error
