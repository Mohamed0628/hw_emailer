name: Validate robotics and consumer hardware boards

on:
  pull_request:
    paths:
      - "config/companies_robotics_consumer_hardware.yaml"
      - "scripts/validate_robotics_consumer_hardware_boards.py"
      - ".github/workflows/discover-robotics-consumer-hardware.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate final public ATS boards
        shell: bash
        run: |
          set +e
          python scripts/validate_robotics_consumer_hardware_boards.py | tee robotics-consumer-hardware-validation.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robotics-consumer-hardware-validation
          path: robotics-consumer-hardware-validation.txt
          if-no-files-found: error
