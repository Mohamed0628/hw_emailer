# General run settings.

state_file: data/seen_jobs.json
prune_after_days: 120

runtime:
  source_workers: 50
  slow_source_seconds: 8

http:
  timeout_seconds: 10
  retries: 1
  retry_backoff_seconds: 1
  user_agent: "hw-emailer/2.0 (+https://github.com/) personal job alerter"
  per_request_delay: 0.0

max_jobs_per_source: 0

email:
  enabled: true
  subject_prefix: "[Hardware Job Alert]"
  category_order: [rf_wireless, power_electronics, pcb_board_design, analog_mixed_signal, medtech_hardware, controls_motion, semiconductor_asic, digital_hardware_fpga, avionics_space, general_electrical, other]
  faang_companies:
    - medtronic
    - starkey
    - tactile
    - boston
    - abbott
    - solventum
    - integer
    - inspire
    - coloplast
    - acist
    - surmodics
    - cvrx
    - imricor
    - cirtec
    - cretex
    - resonetics
    - nortech
    - beacon
    - nvidia
    - apple
    - amd
    - qualcomm
    - spacex
    - anduril

sms:
  enabled: false
  template: "{n} new hardware or early-career opportunities today. Check your email."
  min_jobs: 1

suppress_when_empty: true

# Application modes and limits live in application_policy.yaml.
