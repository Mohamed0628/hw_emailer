
# Filtering rules. Everything here is tunable without touching Python code.
#
# A job is kept only if it passes all applicable checks:
# 1. It is an allowed internship or new-grad role.
# 2. Its detected season and year are allowed.
# 3. Its title matches a target engineering category.
# 4. Its location is in the United States or is otherwise US-eligible.

# ---------------------------------------------------------------------------
# 1) ROLE / SEASON / YEAR
# ---------------------------------------------------------------------------
role:
  # Enable or disable each type of opportunity independently.
  allow_internships: true
  allow_new_grad: true

  # Title substrings that identify internships and co-ops.
  internship_terms:
    - intern
    - internship
    - co-op
    - coop
    - "co op"
    - "summer analyst"
    - "industrial placement"
    - student

  # Title substrings that identify explicit new-grad and early-career roles.
  #
  # These terms are intentionally conservative. Generic titles such as
  # "Electrical Engineer" are not enough by themselves because they could
  # require several years of experience.
  new_grad_terms:
    - "new grad"
    - "new graduate"
    - "graduate engineer"
    - "graduate program"
    - "graduate programme"
    - "recent graduate"
    - "university graduate"
    - "college graduate"
    - "early career"
    - "early-career"
    - "entry level"
    - "entry-level"
    - "campus hire"
    - "campus graduate"
    - "university hire"
    - "associate engineer"
    - "associate electrical engineer"
    - "associate hardware engineer"
    - "associate firmware engineer"
    - "rotational engineer"
    - "engineering rotational"
    - "engineering development program"
    - "engineering development programme"

  # Reject titles containing clear seniority or management indicators.
  #
  # Full-time terms are included for compatibility with the filtering code,
  # but they are not treated as hard exclusions for valid new-grad roles.
  exclude_terms:
    - senior
    - staff
    - principal
    - lead
    - manager
    - director
    - supervisor
    - architect
    - distinguished
    - fellow
    - "vice president"
    - "head of"
    - "full-time"
    - "full time"
    - fulltime

  # Accepted internship seasons.
  #
  # New-grad postings usually have no season in their titles, so they will
  # still be kept when no season can be detected.
  #
  # Empty list = accept every season.
  seasons:
    - summer
    - spring
    - fall
    - offcycle
    - winter

  # Accepted years when a year appears in the title or source metadata.
  #
  # Jobs with no detectable year are kept because many ATS postings omit it.
  years:
    - 2026
    - 2027

# ---------------------------------------------------------------------------
# 2) CATEGORY KEYWORDS
#
# The title is checked against each category in order. The first match wins.
# Silicon appears before hardware so a title such as "ASIC Design Intern"
# is classified as silicon rather than generic hardware.
# ---------------------------------------------------------------------------
categories:
  silicon:
    - asic
    - vlsi
    - rtl
    - "digital design"
    - "digital ic"
    - "analog design"
    - "analog ic"
    - "mixed-signal"
    - "mixed signal"
    - "design verification"
    - "verification engineer"
    - "verification intern"
    - "physical design"
    - dft
    - silicon
    - "soc "
    - "soc,"
    - "soc design"
    - "system-on-chip"
    - rfic
    - "rf ic"
    - "cpu design"
    - "gpu design"
    - "chip design"
    - "memory design"
    - tapeout
    - "cad engineer"
    - "emulation engineer"
    - "circuit design"
    - fpga

  hardware:
    - "hardware engineer"
    - "hardware engineering"
    - "hardware design"
    - "hardware development"
    - "hardware test"
    - "hardware intern"
    - "hardware co-op"
    - "electrical engineer"
    - "electrical engineering"
    - "electrical intern"
    - "electrical design"
    - "electronics engineer"
    - "electronics engineering"
    - "electronics intern"
    - pcb
    - "power electronics"
    - "power engineer"
    - "controls engineer"
    - "control systems"
    - "automation engineer"
    - "systems engineer"
    - "rf engineer"
    - "rf intern"
    - "rf design"
    - antenna
    - "signal integrity"
    - "power integrity"
    - "board design"
    - avionics
    - "test engineer"
    - mechatronics
    - robotics
    - "electromechanical"
    - "instrumentation engineer"

  firmware:
    - firmware
    - "embedded software"
    - "embedded systems"
    - "embedded engineer"
    - "embedded intern"
    - "bare metal"
    - "bare-metal"
    - rtos
    - "device driver"
    - "bsp "
    - microcontroller

# If true, a job must match at least one category group.
require_category: true

