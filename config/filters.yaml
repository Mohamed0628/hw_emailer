# Filtering rules. Everything here is tunable without touching code.
# A job is kept only if it passes ALL of: role/season, category keywords, US location, active.

# ---------------------------------------------------------------------------
# 1) ROLE / SEASON
# ---------------------------------------------------------------------------
role:
  # We only want internships (not new-grad full-time / experienced).
  require_internship: true

  # Title substrings (lowercased) that mark a posting as an internship.
  internship_terms:
    - intern
    - internship
    - co-op
    - coop
    - "co op"
    - summer analyst        # banks/quant call interns "summer analyst"
    - industrial placement
    - student

  # If a title contains any of these, it is rejected outright (full-time/senior roles).
  # NOTE: applied carefully — "intern" titles win even if "engineer" appears.
  exclude_terms:
    - senior
    - staff
    - principal
    - lead
    - manager
    - director
    - "full-time" # only excluded when no internship term present (see code)
    - "full time"

  # Seasons we accept. A job's season is detected from tags or title.
  # Empty list = accept any season.
  seasons:
    - summer
    - spring
    - fall          # keep fall/off-cycle co-ops; remove if you only want summer/spring
    - offcycle
    - winter

  # Only keep postings whose detected year is in this list (when a year is detectable).
  # Jobs with no detectable year are kept (many ATS postings omit the year).
  years:
    - 2026
    - 2027

# ---------------------------------------------------------------------------
# 2) CATEGORY KEYWORDS  (title is matched against each group; first hit wins)
#    Order matters: silicon is checked before hardware so "ASIC Design Intern"
#    classifies as silicon, not generic hardware.
# ---------------------------------------------------------------------------
categories:
  silicon:                 # chip design / verification / physical design
    - asic
    - vlsi
    - rtl
    - "digital design"
    - "digital ic"
    - "analog design"
    - "analog ic"
    - "mixed-signal"
    - "mixed signal"
    - "design verification"
    - "verification engineer"
    - "verification intern"
    - "physical design"
    - dft
    - "silicon"
    - "soc "
    - "soc,"
    - "soc design"
    - "system-on-chip"
    - rfic
    - "rf ic"
    - "cpu design"
    - "gpu design"
    - "chip design"
    - "memory design"
    - tapeout
    - "cad engineer"
    - "emulation engineer"
    - "circuit design"
    - fpga
  hardware:                # board / system-level electrical engineering
    - "hardware engineer"
    - "hardware engineering"
    - "hardware design"
    - "hardware development"
    - "hardware test"
    - "hardware intern"
    - "hardware co-op"
    - "electrical engineer"
    - "electrical engineering"
    - "electrical intern"
    - "electrical design"
    - "electronics engineer"
    - "electronics intern"
    - pcb
    - "power electronics"
    - "rf engineer"
    - "rf intern"
    - "rf design"
    - antenna
    - "signal integrity"
    - "power integrity"
    - "board design"
    - avionics
    - "test engineer"       # HW companies' test-eng interns; remove if too broad
    - mechatronics
  firmware:                # embedded software close to the metal
    - firmware
    - "embedded software"
    - "embedded systems"
    - "embedded engineer"
    - "embedded intern"
    - "bare metal"
    - "bare-metal"
    - rtos
    - "device driver"
    - "bsp "
    - microcontroller

# If true, a job must match at least one category group to be kept.
require_category: true

