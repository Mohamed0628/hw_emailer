# Community-maintained internship and new-grad aggregators.
#
# These lists skew software, but hardware, EE, firmware, robotics, and consumer
# electronics roles appear in them. Local filters discard unrelated software
# titles and non-US postings.
#
# Currently tracking the 2027 cycle. Update cycle-specific URLs when the next
# recruiting cycle begins.

enabled: true

# JSON lists using the SimplifyJobs-style listings.json schema.
lists:
  - name: vanshb03-summer2027
    url: https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json

# README markdown tables.
readme_tables:
  - name: zapply-2027
    url: https://raw.githubusercontent.com/zapplyjobs/Internships-2027/main/README.md

  # Daily 2027 US new-graduate list. Hardware and electronics roles are kept by
  # the local category filter. Titles that explicitly say 2026 or another year
  # are rejected instead of being relabeled as 2027.
  - name: speedyapply-2027-new-grad-usa
    url: https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/NEW_GRAD_USA.md
    default_year: 2027
    role_type: new_grad
    reject_explicit_other_years: true
