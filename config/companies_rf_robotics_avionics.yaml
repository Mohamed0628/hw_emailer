workday:
  # Commercial RF semiconductor employers. A compact search set keeps the
  # additional Workday runtime controlled while covering relevant internships.
  - company: Skyworks Solutions
    tenant: skyworksinc
    wd_num: 5
    site: Skyworks
    search_texts: &rf_early_career_searches
      - rf intern
      - electrical engineering intern
      - hardware intern
      - applications engineering intern
      - new graduate rf engineer
      - engineer i rf
    fetch_details: true
  - company: Qorvo
    tenant: qorvo
    wd_num: 5
    site: Qorvo_Careers
    search_texts: *rf_early_career_searches
    fetch_details: true
  - company: Qualcomm
    tenant: qualcomm
    wd_num: 5
    site: External
    search_texts: *rf_early_career_searches
    fetch_details: true
